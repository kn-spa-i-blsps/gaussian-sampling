[project]
name = "gaussiansampler"
version = "0.0.1"
description = "A gaussian splatting sampler and filterer of images which aims to eliminate bad quality ones, most importantly those that view things outside of the splat."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "malevitzch", email = "malevitzch@gmail.com" }
]
keywords = ["gaussian-splatting"]

dependencies = [
  "numpy>=1.26.0",
  "pillow>=10.0.0",
  "torch>=2.6",
  "plyfile>=1.0.0",
  "pygame>=2.5.0",
  "setuptools>=72.0.0,<=73.0.0",
  "gsplat",
  "gsplat-mlx @ git+https://github.com/RobotFlow-Labs/gsplat-mlx.git ; sys_platform == 'darwin'",
]

[tool.setuptools.packages.find]
where = ["src"]
