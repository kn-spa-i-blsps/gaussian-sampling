[project]
name = "gaussiansampler"
version = "0.0.1"
description = "A gaussian splatting sampler and filterer of images which aims to eliminate bad quality ones, most importantly those that view things outside of the splat."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "malevitzch", email = "malevitzch@gmail.com" }
]
keywords = ["gaussian-splatting"]
dependencies = [
  "numpy>=1.26.0",
  "pillow>=10.0.0",
  "torch>=2.6",
  "plyfile>=1.0.0",
  "pyside6>=6.7.0",
  "pygame>=2.5.0",
  "gsplat",
  "nerfstudio",
]
[project.scripts]
gs-record-water = "gaussiansampler.scripts.record_water:main"
gs-record = "gaussiansampler.scripts.record:main"
gs-filter = "gaussiansampler.scripts.filter:main"
gs-score = "gaussiansampler.scripts.score:main"
[build-system]
requires = ["setuptools>=72.0.0,<=73.0.0"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]
